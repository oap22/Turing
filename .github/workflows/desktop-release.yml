name: Desktop release

# Builds the macOS desktop app (Apple Silicon) as a .dmg and attaches it to a
# GitHub Release, so installing on another Mac is "download, drag, right-click
# → Open" instead of "clone the repo and build Rust". Triggered by pushing a
# `desktop-v*` tag; `workflow_dispatch` builds the artifact without a release
# for a trial run.
#
# Signing: the bundle is ad-hoc signed (`signingIdentity: "-"` in
# tauri.conf.json), not notarized. Gatekeeper will quarantine the download
# and ask for a one-time right-click → Open; that is documented in
# desktop/README.md. Linux/Windows lanes live in ci.yml (PRs #410/#412).

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install webui deps
        working-directory: webui
        run: npm ci --legacy-peer-deps

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build app + dmg
        # `build` chains the webui build via tauri.conf.json's beforeBuildCommand.
        working-directory: desktop
        run: npm run build -- --bundles app,dmg

      - name: Name the artifact
        id: name
        run: |
          set -euo pipefail
          dmg="$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -n1)"
          ref="${GITHUB_REF_NAME:-manual}"
          out="turing-${ref}-macos-arm64.dmg"
          cp "$dmg" "$out"
          shasum -a 256 "$out" > "$out.sha256"
          echo "dmg=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.dmg }}
          path: |
            ${{ steps.name.outputs.dmg }}
            ${{ steps.name.outputs.dmg }}.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.name.outputs.dmg }}
            ${{ steps.name.outputs.dmg }}.sha256
          generate_release_notes: true
