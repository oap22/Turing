name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build webui (required by pyproject force-include)
        working-directory: webui
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Run tests with coverage
        # Exclude `integration` — the dedicated `integration` job below runs
        # the real-broker tests with INTEGRATION_REQUIRED=1 so a missing
        # docker daemon turns into a hard CI failure.
        run: pytest tests/ -v -m "not integration" --ignore=tests/integration --cov=turing --cov-report=term-missing --cov-fail-under=75

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"

      - name: Verify Docker is available
        run: docker info

      - name: Pre-pull nats:2.10
        run: docker pull nats:2.10

      - name: Run real-broker integration tests
        env:
          INTEGRATION_REQUIRED: "1"
        run: pytest tests/integration -v -m integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --strict --skip-editable .

  tui:
    # The Rust operator surface (tui/). Same gates as the crate's own README:
    # formatting, clippy-as-errors, and the unit + render-smoke test suite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          cargo --version

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
