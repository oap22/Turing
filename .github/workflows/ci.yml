name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs run 3.11 only (Actions-minutes budget under parallel agent PRs,
        # issue #356); pushes to main run the full matrix as the post-merge
        # canary. Required status checks should pin to `test (3.11)`.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build webui (required by pyproject force-include)
        working-directory: webui
        run: |
          npm ci --legacy-peer-deps
          npm run test
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Run tests with coverage
        # Exclude `integration` — the dedicated `integration` job below runs
        # the real-broker tests with INTEGRATION_REQUIRED=1 so a missing
        # docker daemon turns into a hard CI failure.
        run: pytest tests/ -v -m "not integration" --ignore=tests/integration --cov=turing --cov-report=term-missing --cov-fail-under=75

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"

      - name: Verify Docker is available
        run: docker info

      - name: Pre-pull nats:2.10
        # Docker Hub occasionally times out on hosted runners; retry with
        # backoff so a registry blip doesn't fail the whole job.
        run: |
          for delay in 5 15 30 60; do
            docker pull nats:2.10 && exit 0
            echo "docker pull failed; retrying in ${delay}s..."
            sleep "$delay"
          done
          docker pull nats:2.10

      - name: Run real-broker integration tests
        env:
          INTEGRATION_REQUIRED: "1"
        run: pytest tests/integration -v -m integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --strict --skip-editable .

  tui:
    # The Rust operator surface (tui/). Same gates as the crate's own README:
    # formatting, clippy-as-errors, and the unit + render-smoke test suite.
    # On PRs the heavy steps run only when tui/** changed (issue #356); the
    # job itself still reports success, so it stays safe as a required check.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect tui changes
        id: diff
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "tui=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -q '^tui/'; then
            echo "tui=true" >> "$GITHUB_OUTPUT"
          else
            echo "tui=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Toolchain
        if: steps.diff.outputs.tui == 'true'
        run: |
          rustup component add rustfmt clippy
          cargo --version

      - name: Cargo cache
        if: steps.diff.outputs.tui == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui

      - name: Format check
        if: steps.diff.outputs.tui == 'true'
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        if: steps.diff.outputs.tui == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: steps.diff.outputs.tui == 'true'
        run: cargo test

  desktop-windows:
    # Windows NSIS installer for the desktop shell (issue #399). Same
    # path-filter pattern as `tui`: on PRs the heavy steps run only when
    # desktop/** or webui/** changed (webui is the bundled frontendDist), so
    # the job stays safe as a required check while it reports success on
    # unrelated PRs. Windows runners bill Actions minutes at 2x — keep the
    # gate tight. `bundle.targets` stays macOS-only in tauri.conf.json; the
    # Windows bundle is selected per-invocation with `--bundles nsis`
    # (`--bundles msi` also works when an MSI is wanted). The installer is
    # unsigned: `bundle.windows.certificateThumbprint` is a placeholder
    # (null) until a code-signing cert exists, so SmartScreen will warn on
    # first run — documented in docs/operator/windows.md.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect desktop changes
        id: diff
        shell: bash
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -qE '^(desktop/|webui/|\.github/workflows/ci\.yml)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.diff.outputs.desktop == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Cargo cache
        if: steps.diff.outputs.desktop == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install webui dependencies
        if: steps.diff.outputs.desktop == 'true'
        working-directory: webui
        run: npm ci --legacy-peer-deps

      - name: Install desktop dependencies (tauri CLI)
        if: steps.diff.outputs.desktop == 'true'
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        # `beforeBuildCommand` builds the webui (frontendDist) itself; the
        # tauri CLI is invoked directly because desktop's `npm run build`
        # script uses POSIX mkdir/touch.
        if: steps.diff.outputs.desktop == 'true'
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - name: Upload NSIS artifact
        if: steps.diff.outputs.desktop == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: turing-desktop-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  desktop-linux:
    # The Tauri desktop shell (desktop/), Linux packaging lane (issue #400):
    # fmt, clippy-as-errors, unit tests, then real Linux bundles
    # (AppImage/deb/rpm). `bundle.targets` in tauri.conf.json stays the macOS
    # pair ["app", "dmg"]; Linux bundles are requested per-invocation via
    # `--bundles appimage,deb,rpm` so a plain macOS build never attempts them.
    # On PRs the heavy steps run only when desktop/, webui/ (frontendDist), or
    # this workflow changed (Actions-minutes budget, issue #356); the job
    # itself still reports success, so it stays safe as a required check.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect desktop changes
        id: diff
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -qE '^(desktop/|webui/|\.github/workflows/ci\.yml)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: System dependencies (Tauri v2 Linux prerequisites)
        if: steps.diff.outputs.desktop == 'true'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - name: Set up Node
        if: steps.diff.outputs.desktop == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json

      - name: Build webui (frontendDist, embedded at compile time)
        if: steps.diff.outputs.desktop == 'true'
        working-directory: webui
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Toolchain
        if: steps.diff.outputs.desktop == 'true'
        run: |
          rustup component add rustfmt clippy
          cargo --version

      - name: Cargo cache
        if: steps.diff.outputs.desktop == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Format check
        if: steps.diff.outputs.desktop == 'true'
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        if: steps.diff.outputs.desktop == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: steps.diff.outputs.desktop == 'true'
        run: cargo test

      - name: Build Linux bundles (AppImage/deb/rpm)
        if: steps.diff.outputs.desktop == 'true'
        working-directory: desktop
        run: |
          npm ci
          npm run build -- --bundles appimage,deb,rpm

      - name: Upload bundles
        if: steps.diff.outputs.desktop == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: turing-desktop-linux-bundles
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
