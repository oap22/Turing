[package]
name = "turing-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Snappy terminal operator surface for the Turing cluster — mirrors the webui over the gateway HTTP/WS API."
license = "MIT"
repository = "https://github.com/oap22/Turing"
default-run = "turing-tui"

[[bin]]
name = "turing-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

[dev-dependencies]
# (unit tests use only std + serde_json, already above)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
