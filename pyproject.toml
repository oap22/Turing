[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turing"
version = "0.1.0"
description = "Autonomous AI Assistant for Raspberry Pi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Owen Pacetti" },
]

dependencies = [
    "anthropic>=0.109.1",
    "ollama>=0.6.2",
    "aiosqlite>=0.22.1",
    "sqlite-vec>=0.1.9",
    "pydantic-settings>=2.14.1",
    "structlog>=26.1.0",
    "pyzmq>=27.1.0",
    "psutil>=7.2.2",
    "httpx>=0.28.1",
    "tokenizers>=0.23.1",
    "numpy>=2.4.6",
    "cryptography>=48.0.0",
    "nats-py>=2.15.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
embeddings = ["onnxruntime>=1.26.0"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "alembic>=1.18.4",
    "types-psutil",
    "types-PyYAML",
    "testcontainers>=4.14.2",
]

[project.scripts]
turing = "turing.__main__:main"
turing-ui = "turing.launcher:main"
turing-gateway = "turing.gateway.__main__:main"
turing-vault-watcher = "turing.vault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turing"]

# Ship the SPA build output inside the wheel so `pip install turing` is
# self-contained — no separate static-files volume. The bundle is included
# conditionally by ``hatch_build.py`` only when ``webui/dist`` exists, so
# ``pip install -e .`` works in a fresh worktree without a Node toolchain.
# Run ``npm run build`` in webui/ before building a release wheel; the
# gateway resolves this path via ``turing.gateway.spa_assets_path()``.
# See issue #195.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator
    "RUF001", # ambiguous unicode in strings (greek letters, em-dashes in docstrings)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["turing"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Force imports from this worktree's src/ so pytest never resolves `turing`
# from another editable checkout (#335).
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "tokenizers", "trl", "torch", "torch.*", "peft"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["turing"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
