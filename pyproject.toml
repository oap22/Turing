[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turing"
version = "0.1.0"
description = "Autonomous AI Assistant for Raspberry Pi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Owen Pacetti" },
]

dependencies = [
    "anthropic>=1.4.0",
    "ollama>=0.6.2",
    "aiosqlite>=0.22.1",
    "sqlite-vec>=0.1.9",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "pyzmq>=27.2.0",
    "psutil>=7.2.2",
    "httpx>=0.28.1",
    "tokenizers>=0.23.1",
    "numpy>=2.4.6",
    "matplotlib>=3.10",
    "cryptography>=50.0.1",
    "nats-py>=2.15.0",
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
embeddings = ["onnxruntime>=1.26.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "pytest-timeout>=2.4.0",
    "ruff",
    "mypy",
    "alembic>=1.19.1",
    "types-psutil",
    "types-PyYAML",
    "testcontainers>=4.15.0",
]

[project.scripts]
turing = "turing.__main__:main"
turing-ui = "turing.launcher:main"
turing-gateway = "turing.gateway.__main__:main"
turing-vault-watcher = "turing.vault.cli:main"
turing-agent-mailbox = "turing.agent_mailbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turing"]

# Ship the SPA build output inside the wheel so `pip install turing` is
# self-contained — no separate static-files volume. The bundle is included
# conditionally by ``hatch_build.py`` only when ``webui/dist`` exists, so
# ``pip install -e .`` works in a fresh worktree without a Node toolchain.
# Run ``npm run build`` in webui/ before building a release wheel; the
# gateway resolves this path via ``turing.gateway.spa_assets_path()``.
# See issue #195.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator
    "RUF001", # ambiguous unicode in strings (greek letters, em-dashes in docstrings)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["turing"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Force imports from this worktree's src/ so pytest never resolves `turing`
# from another editable checkout (#335).
pythonpath = ["src"]
asyncio_mode = "auto"
# Backstop for a test that wedges mid-run (#384). Generous on purpose — the
# slowest real test is far under this, so a trip means a genuine hang.
#
# The method is left to pytest-timeout, which picks `signal` wherever SIGALRM
# exists (Linux CI, macOS). That turns a hang into an ordinary failure of the
# offending test with the rest of the suite still running and the coverage
# report intact; the `thread` method ends in `os._exit(1)`, which aborts the
# whole session and reports an exit code indistinguishable from a normal test
# failure.
#
# This does NOT cover a hang *after* the session ends: nothing is running
# then, so no per-test timer can fire. That case is the exit watchdog in
# tests/conftest.py.
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

[tool.mypy]
# No `python_version` pin: mypy targets whatever interpreter it runs under,
# which is exactly what the CI matrix already means. Pinning it to "3.11" made
# mypy parse *every* file against 3.11 syntax — including third-party stubs —
# and broke the moment numpy 2.5 (requires-python >=3.12, PEP 695 `type`
# statements in its stubs) became installable on the 3.12/3.13 jobs. The 3.11
# job still checks 3.11 semantics, which is the guarantee the pin was there to
# give. See #395.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "tokenizers", "trl", "torch", "torch.*", "peft"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["turing"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
