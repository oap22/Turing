# Alembic configuration for Turing memory store migrations.

[alembic]
# Path to the migration environment
script_location = alembic

# Template used to generate migration file names.
# Uncomment the line below if you want ISO date prefixes:
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py
# file to be detected as revisions in the versions/ directory.
# sourceless = false

# Version location specification; this defaults to alembic/versions.
# When using multiple version directories, initial revisions must be
# specified with --version-path.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# The output encoding used when revision files are written from
# script.py.mako.
# output_encoding = utf-8

# SQLite database URL (overridden at runtime by env.py)
sqlalchemy.url = sqlite:///./data/turing.db


[post_write_hooks]
# No post-write hooks configured.


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
